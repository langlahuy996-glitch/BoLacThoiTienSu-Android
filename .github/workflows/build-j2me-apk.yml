name: Probe Bo Lac 320x240 JAR

on:
  push:
    paths:
      - '.github/workflows/build-j2me-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download exact 320x240 JAR with browser headers
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://dinhloi.xtgem.com/java/game/bo-lac-tts/Bo_Lac_Tien_Su_320x240.jar'
          curl -L --retry 3 --retry-delay 2 \
            -A 'Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/131 Mobile Safari/537.36' \
            -e 'https://dinhloi.xtgem.com/game-offline/game-hay/bo-lac-tts' \
            -H 'Accept: application/java-archive,application/octet-stream,*/*' \
            "$URL" -o game.jar
          file game.jar
          wc -c game.jar
          xxd -l 16 game.jar
          unzip -t game.jar
          unzip -p game.jar META-INF/MANIFEST.MF | head -40
