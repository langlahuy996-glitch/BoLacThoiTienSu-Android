name: Probe Retrova download endpoint
on:
  push:
    paths: ['.github/workflows/build-j2me-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect endpoint candidates
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -A 'Mozilla/5.0' 'https://java.retrova.vn/games/47/' -o page.html
          echo '--- ATTRS ---'
          grep -nEi 'href=|action=|onclick=|fetch\(|axios|XMLHttpRequest|/api/|download|\.jar|data-' page.html | tail -220 || true
          echo '--- SCRIPTS ---'
          grep -nEi '<script|src=' page.html | tail -80 || true
          echo '--- LAST 220 ---'
          tail -220 page.html
